modLoader="javafml"
loaderVersion="${neo_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ljfa-ag/TNTUtils/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    updateJSONURL="https://raw.githubusercontent.com/ljfa-ag/TNTUtils/refs/heads/version/version.json"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/tntutils"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[mixins]]
    config="${mod_id}.mixins.json"
[[mixins]]
    config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
