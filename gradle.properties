# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Common
java_version=25
minecraft_version=26.1-snapshot-7
minecraft_version_range=[26,26.2)
# Latest NeoForm versions: https://projects.neoforged.net/neoforged/neoform
neoform_version=26.1-snapshot-7-1
# Latest Parchment versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
# The Mixin and MixinExtras versions should match those used by NeoForge and Fabric
mixin_version=0.8.7
mixinextras_version=0.5.0

## NeoForge
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
neo_version=26.1.0.0-alpha.12+snapshot-7
neo_version_range=[26,)

## Fabric
# Latest Fabric versions: https://fabricmc.net/develop/
# You have to change fabric/src/main/resources/fabric.mod.json as well when changing the Minecraft or loader versions
fabric_version=0.143.4+26.1
fabric_loader_version=0.18.4

## Mod Properties
mod_version=2.0.4
mod_release_type=alpha

mod_id=tntutils
mod_name=TNTUtils
mod_license=MIT
mod_group_id=ljfa.tntutils
mod_authors=ljfa
mod_description=More control over explosions
