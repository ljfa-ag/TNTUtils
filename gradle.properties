# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Common
java_version=17
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.20.2)
# Latest Parchment versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# The Mixin and MixinExtras versions should match those used by Forge and Fabric
mixin_version=0.8.5
#mixinextras_version=0.4.1

## Forge
# Latest Forge versions: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.0
forge_version_range=[47,)
forge_loader_version_range=[47,)

## Fabric
# Latest Fabric versions: https://fabricmc.net/develop/
# You have to change fabric/src/main/resources/fabric.mod.json as well when changing the Minecraft or loader versions
fabric_version=0.92.5+1.20.1
fabric_loader_version=0.16.10

## Mod Properties
mod_version=2.0.2
mod_release_type=alpha

mod_id=tntutils
mod_name=TNTUtils
mod_license=MIT
mod_group_id=ljfa.tntutils
mod_authors=ljfa
mod_description=More control over explosions
