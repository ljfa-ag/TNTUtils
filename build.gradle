plugins {
    // Latest ModDevGradle versions: https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.99' apply false
    // Latest Loom versions: https://fabricmc.net/develop/
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    
    id 'net.darkhax.curseforgegradle' version '1.1.+' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
}

subprojects {
    //Fix conflict with Eclipse launch configs when multiple projects with the same name are in the same workspace
    pluginManager.withPlugin('eclipse') {
        eclipse.project.name = "${project.name}-${project.minecraft_version}"
    }
}
